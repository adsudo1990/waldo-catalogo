<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waldo Deco — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #141414;
  --bg2:    #1c1c1c;
  --bg3:    #242424;
  --red:    #c0272d;
  --red2:   #d94040;
  --text:   #f2f2f2;
  --muted:  #888;
  --border: #2e2e2e;
  --r:      3px;
  --wa:     #25D366;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Fira Sans',sans-serif;font-weight:300;min-height:100vh}

/* ── TOP BAR ── */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar-msg{font-size:.68rem;letter-spacing:.06em;color:var(--muted);flex:1;min-width:180px}
.topbar-msg span{color:var(--text)}
.btn-wa-sm{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:var(--wa);color:#fff;border:none;border-radius:var(--r);font-family:'Fira Sans',sans-serif;font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:background .2s;white-space:nowrap}
.btn-wa-sm:hover{background:#1ebe5a}

/* ── HEADER ── */
header{text-align:center;padding:44px 20px 32px;position:relative;overflow:hidden}
header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:80px;height:1px;background:linear-gradient(to right,transparent,var(--red),transparent)}
.logo-wrap img{height:82px;width:auto;display:block;margin:0 auto}
.header-sub{font-size:.6rem;font-weight:300;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:10px}

/* ── CFG PANEL ── */
.cfg-panel{background:var(--bg3);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-panel label{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.cfg-panel input{background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Fira Sans',sans-serif;font-size:.74rem;padding:5px 10px;border-radius:var(--r);outline:none;width:175px}
.cfg-panel input:focus{border-color:var(--red)}
.btn-cfg{padding:5px 13px;background:transparent;border:1px solid var(--red);color:var(--red);font-family:'Fira Sans',sans-serif;font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-radius:var(--r);transition:all .2s}
.btn-cfg:hover{background:var(--red);color:var(--text)}
.cfg-ok{font-size:.6rem;color:var(--wa);letter-spacing:.08em;display:none}
.cfg-ok.show{display:inline}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(20,20,20,.96);backdrop-filter:blur(14px);z-index:100}
.toolbar-left{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search-wrap{position:relative}
.search-wrap input{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Fira Sans',sans-serif;font-size:.7rem;letter-spacing:.06em;padding:8px 13px 8px 32px;border-radius:var(--r);width:190px;outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.32;pointer-events:none}
.count{font-size:.6rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}

/* ── CART BUTTON FLOTANTE ── */
.cart-fab{position:fixed;bottom:24px;right:24px;z-index:500;display:flex;align-items:center;gap:9px;padding:13px 20px;background:var(--red);color:var(--text);border:none;border-radius:30px;font-family:'Fira Sans',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 28px rgba(192,39,45,.4);transition:all .25s;white-space:nowrap}
.cart-fab:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 10px 34px rgba(192,39,45,.5)}
.cart-fab.hidden{transform:translateY(100px);opacity:0;pointer-events:none}
.cart-badge{background:#fff;color:var(--red);font-size:.65rem;font-weight:700;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:1}

/* ── MASONRY ── */
.grid-wrap{padding:20px}
.masonry{columns:4 255px;column-gap:13px}
.card{break-inside:avoid;margin-bottom:13px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .28s,border-color .28s,box-shadow .28s;animation:cardIn .44s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-5px);border-color:var(--red);box-shadow:0 14px 40px rgba(192,39,45,.13)}
.card-img-wrap{overflow:hidden;height:260px}
.card-img{width:100%;height:100%;display:block;object-fit:cover;object-position:center;transition:transform .5s}
.card:hover .card-img{transform:scale(1.04)}
.card-body{padding:14px}
.card-id{font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;color:var(--red);margin-bottom:3px}
.card-name{font-family:'Fira Sans',sans-serif;font-size:1rem;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-bottom:5px}
.card-desc{font-size:.68rem;font-weight:300;line-height:1.7;color:var(--muted);margin-bottom:11px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-footer{display:flex;align-items:center;justify-content:space-between;gap:7px}
.card-price{font-family:'Fira Sans',sans-serif;font-size:1.15rem;font-weight:700;letter-spacing:-.02em}

.card-btns{display:flex;gap:6px;align-items:center}
.btn-cart-add{display:flex;align-items:center;gap:5px;padding:6px 12px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--r);font-family:'Fira Sans',sans-serif;font-size:.6rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-cart-add:hover,.btn-cart-add.added{background:var(--red);color:var(--text)}
.btn-want-sm{display:flex;align-items:center;gap:4px;padding:6px 10px;background:var(--wa);color:#fff;border:none;border-radius:var(--r);font-family:'Fira Sans',sans-serif;font-size:.6rem;font-weight:600;cursor:pointer;transition:background .2s}
.btn-want-sm:hover{background:#1ebe5a}

.empty{text-align:center;padding:70px 20px;display:none}
.empty.show{display:block}
.empty-icon{font-size:2.8rem;opacity:.14;margin-bottom:14px}
.empty h3{font-size:1.4rem;font-weight:400;margin-bottom:7px}
.empty p{font-size:.7rem;color:var(--muted)}

/* ── LIGHTBOX (sin botón de WhatsApp) ── */
.lb{display:none;position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:13px}
.lb.open{display:flex;animation:lbFade .22s ease}
@keyframes lbFade{from{opacity:0}to{opacity:1}}
.lb-panel{background:var(--bg2);border:1px solid var(--border);border-radius:5px;max-width:960px;width:100%;max-height:90vh;overflow-y:auto;display:grid;grid-template-columns:1.1fr 1fr;position:relative;animation:lbScale .28s ease}
@keyframes lbScale{from{transform:scale(.94)}to{transform:scale(1)}}
@media(max-width:640px){.lb-panel{grid-template-columns:1fr}}
.lb-close{position:absolute;top:11px;right:11px;z-index:10;background:rgba(0,0,0,.6);border:1px solid var(--border);color:var(--muted);width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;transition:all .2s}
.lb-close:hover{border-color:var(--red);color:var(--red)}
.lb-car{position:relative;background:#0d0d0d;overflow:hidden;min-height:480px}
.lb-slides{display:flex;transition:transform .38s cubic-bezier(.4,0,.2,1);height:100%}
.lb-slide{flex:0 0 100%}
.lb-slide img{width:100%;height:480px;object-fit:contain;object-position:center;display:block;background:#0d0d0d}
.lb-arr{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);border:1px solid var(--border);color:var(--text);width:33px;height:33px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;z-index:2;transition:all .2s}
.lb-arr:hover{background:var(--red);border-color:var(--red)}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.lb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:all .2s}
.lb-dot.on{background:var(--red);transform:scale(1.3)}
.lb-info{padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:16px}
.lb-tag{font-size:.56rem;letter-spacing:.26em;color:var(--red);text-transform:uppercase}
.lb-name{font-size:clamp(1.35rem,3.5vw,1.9rem);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:5px 0 9px}
.lb-desc{font-size:.75rem;font-weight:300;line-height:1.9;color:var(--muted);flex:1}
.lb-divider{width:36px;height:1px;background:var(--red);margin:13px 0}
.lb-price{font-size:1.8rem;font-weight:700;letter-spacing:-.03em}
.lb-qty-row{display:flex;align-items:center;gap:10px;margin:10px 0}
.lb-qty-label{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qty-ctrl{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.qty-ctrl button{background:var(--bg3);color:var(--text);border:none;width:30px;height:30px;font-size:1rem;cursor:pointer;transition:background .15s}
.qty-ctrl button:hover{background:var(--red)}
.qty-ctrl span{background:var(--bg2);padding:0 14px;font-size:.82rem;font-weight:500;height:30px;display:flex;align-items:center;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.lb-btn-row{display:flex;gap:8px;margin-top:6px}
.lb-btn-cart{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--r);font-family:'Fira Sans',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.lb-btn-cart:hover,.lb-btn-cart.added{background:var(--red);color:var(--text)}

/* ── DRAWER CARRITO ── */
.cart-overlay{display:none;position:fixed;inset:0;z-index:800;background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.cart-overlay.open{display:block}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg2);border-left:1px solid var(--border);z-index:900;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
.cart-drawer.open{transform:translateX(0)}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--border)}
.cart-title{font-size:1.4rem;font-weight:700}
.cart-title-count{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);margin-top:2px}
.cart-close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.cart-close-btn:hover{border-color:var(--red);color:var(--red)}
.cart-items{flex:1;overflow-y:auto;padding:16px 22px}
.cart-empty-msg{text-align:center;padding:50px 0;color:var(--muted)}
.cart-empty-msg div{font-size:2.2rem;opacity:.15;margin-bottom:12px}
.cart-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.ci-img{width:58px;height:58px;border-radius:var(--r);overflow:hidden;flex-shrink:0;background:#2a2a2a;display:flex;align-items:center;justify-content:center}
.ci-img img{width:100%;height:100%;object-fit:cover}
.ci-info{flex:1}
.ci-id{font-size:.53rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.ci-name{font-size:.88rem;font-weight:600;margin:2px 0 6px}
.ci-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ci-price{font-size:.95rem;font-weight:700}
.ci-qty{display:flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.ci-qty button{background:var(--bg3);color:var(--text);border:none;width:26px;height:26px;cursor:pointer}
.ci-qty button:hover{background:var(--red)}
.ci-qty span{background:var(--bg2);padding:0 10px;font-size:.78rem;height:26px;display:flex;align-items:center}
.ci-del{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px}
.ci-del:hover{color:var(--red)}
.cart-foot{padding:18px 22px;border-top:1px solid var(--border);background:var(--bg2)}
.cart-total-row{display:flex;justify-content:space-between;margin-bottom:6px}
.cart-total-label{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cart-total-val{font-size:1.65rem;font-weight:700}
.cart-subtxt{font-size:.6rem;color:var(--muted);margin-bottom:16px}
.cart-subtxt span{color:var(--red)}
.btn-pedido{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px;background:var(--wa);color:#fff;border:none;border-radius:var(--r);cursor:pointer}
.btn-pedido:hover{background:#1ebe5a}
.btn-vaciar{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:9px;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:var(--r);cursor:pointer;margin-top:8px}
.btn-vaciar:hover{border-color:var(--red);color:var(--red)}

/* ── CATEGORIES ── */
.cat-bar{padding:0 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border);background:var(--bg);cursor:grab}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);font-size:.68rem;cursor:pointer;white-space:nowrap;margin:10px 0}
.cat-chip:hover{border-color:var(--red);color:var(--text)}
.cat-chip.active{background:var(--red);border-color:var(--red);color:#fff}
.cat-chip .chip-count{background:rgba(255,255,255,.15);padding:1px 6px;border-radius:10px}

/* ── ADMIN MODE ── */
.admin-only{display:none !important}
body.admin-mode .admin-only{display:flex !important}
body.admin-mode .cfg-panel{display:flex !important}
.cfg-panel{display:none !important}
.admin-lock{display:flex;align-items:center;gap:5px;font-size:.55rem;color:var(--border);cursor:pointer;padding:4px 8px}
.admin-lock:hover{color:var(--muted)}
body.admin-mode .admin-lock{color:var(--red)}
.admin-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border);padding:10px 22px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .3s;white-space:nowrap}
.admin-toast.show{opacity:1}

footer{text-align:center;padding:28px 20px;border-top:1px solid var(--border);font-size:.58rem;color:var(--muted)}
footer span{color:var(--red)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@media(max-width:480px){.masonry{columns:2 138px}.grid-wrap{padding:11px}}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-msg"><span style="color:#c0272d">Hacé tu Evento</span> — 100% Personalizado</div>
  <a id="waTopBtn" href="#" class="btn-wa-sm" target="_blank">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Contactar
  </a>
</div>

<header>
  <div class="logo-wrap"><img src="imgs/logo-waldo.png" alt="Waldo Deco"></div>
  <div class="header-sub">Catálogo de Productos</div>
</header>

<div class="cfg-panel">
  <label>⚙ Tu número WhatsApp:</label>
  <input type="tel" id="waInput" placeholder="5491112345678">
  <button class="btn-cfg" onclick="saveWA()">Guardar número</button>
  <button class="btn-cfg" onclick="exportJSON()" style="border-color:#3B8BD4;color:#3B8BD4">↓ Exportar JSON</button>
  <span class="cfg-ok" id="cfgOk">✓ Guardado</span>
</div>

<div class="toolbar">
  <div class="toolbar-left">
    <div class="search-wrap">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchIn" placeholder="Buscar..." oninput="renderGrid()">
    </div>
  </div>
  <span class="count" id="countEl">0 productos</span>
  <div class="admin-lock" id="adminLock" onclick="adminClick()">🔒</div>
</div>

<div class="cat-bar" id="catBar">
  <button class="cat-chip active" data-cat="Todos" onclick="setCategory('Todos')">Todos <span class="chip-count" id="cnt-Todos">0</span></button>
  <button class="cat-chip" data-cat="Centros de mesa" onclick="setCategory('Centros de mesa')">Centros de mesa <span class="chip-count" id="cnt-Centros de mesa">0</span></button>
  <button class="cat-chip" data-cat="Lámparas" onclick="setCategory('Lámparas')">Lámparas <span class="chip-count" id="cnt-Lámparas">0</span></button>
  <button class="cat-chip" data-cat="Souvenirs" onclick="setCategory('Souvenirs')">Souvenirs <span class="chip-count" id="cnt-Souvenirs">0</span></button>
  <button class="cat-chip" data-cat="Macetas" onclick="setCategory('Macetas')">Macetas <span class="chip-count" id="cnt-Macetas">0</span></button>
  <button class="cat-chip" data-cat="Tortas y repostería" onclick="setCategory('Tortas y repostería')">Tortas <span class="chip-count" id="cnt-Tortas y repostería">0</span></button>
  <button class="cat-chip" data-cat="Portarretratos" onclick="setCategory('Portarretratos')">Portarretratos <span class="chip-count" id="cnt-Portarretratos">0</span></button>
  <button class="cat-chip" data-cat="Otros" onclick="setCategory('Otros')">Otros <span class="chip-count" id="cnt-Otros">0</span></button>
</div>

<div class="grid-wrap">
  <div class="masonry" id="masonry"></div>
  <div class="empty" id="emptyEl"><div class="empty-icon">🏷</div><h3>Catálogo vacío</h3><p>Cargando productos...</p></div>
</div>

<!-- BOTÓN FLOTANTE "MI PEDIDO" -->
<button class="cart-fab hidden" id="cartFab" onclick="openCart()">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 001.97 1.61H19a2 2 0 001.97-1.68L22.76 6H6"/></svg>
  MI PEDIDO
  <span class="cart-badge" id="cartBadge">0</span>
</button>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-head">
    <div><div class="cart-title">Mi Pedido</div><div class="cart-title-count" id="cartTitleCount">0 productos</div></div>
